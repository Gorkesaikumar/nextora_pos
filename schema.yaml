openapi: 3.0.3
info:
  title: Nextora POS API
  version: v1
paths:
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout_create
      description: Revoke specific refresh token session and blacklist token.
      tags:
      - auth
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/auth/logout-all/:
    post:
      operationId: auth_logout_all_create
      description: Globally revoke all active device sessions and increment token_version.
      tags:
      - auth
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
