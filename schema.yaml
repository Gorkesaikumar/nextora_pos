components:
  schemas:
    AlertTypeEnum:
      enum:
      - low_stock
      - out_of_stock
      - expiry_soon
      - expired
      - damaged
      type: string
      description: |-
        * `low_stock` - Low Stock
        * `out_of_stock` - Out of Stock
        * `expiry_soon` - Expiring Soon
        * `expired` - Expired
        * `damaged` - Damaged Stock
    Attendance:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        employee:
          type: string
          format: uuid
        employee_name:
          type: string
          readOnly: true
        shift:
          type: string
          format: uuid
          nullable: true
        shift_name:
          type: string
          readOnly: true
        date:
          type: string
          format: date
          readOnly: true
        check_in:
          type: string
          format: date-time
        check_out:
          type: string
          format: date-time
          nullable: true
        break_start:
          type: string
          format: date-time
          nullable: true
        break_end:
          type: string
          format: date-time
          nullable: true
        status:
          allOf:
          - $ref: '#/components/schemas/AttendanceStatusEnum'
          readOnly: true
        is_late_entry:
          type: boolean
          readOnly: true
        is_early_exit:
          type: boolean
          readOnly: true
        is_manual:
          type: boolean
          description: Manually added/corrected by admin
        notes:
          type: string
      required:
      - check_in
      - date
      - employee
      - employee_name
      - id
      - is_early_exit
      - is_late_entry
      - shift_name
      - status
    AttendanceStatusEnum:
      enum:
      - present
      - late
      - half_day
      - absent
      type: string
      description: |-
        * `present` - Present
        * `late` - Late
        * `half_day` - Half Day
        * `absent` - Absent
    Batch:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        inventory_item:
          type: string
          format: uuid
        batch_number:
          type: string
          description: Manufacturer batch / lot number
          maxLength: 80
        manufacture_date:
          type: string
          format: date
          nullable: true
        expiry_date:
          type: string
          format: date
          nullable: true
        quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,11}(?:\.\d{0,3})?$
          description: Current quantity remaining in this batch
        unit_cost:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,4})?$
          description: Cost per unit at the time this batch was received
        purchase_order_id:
          type: string
          format: uuid
          readOnly: true
          nullable: true
          description: Soft FK to the PurchaseOrder that created this batch
        is_active:
          type: boolean
        is_expired:
          type: boolean
          readOnly: true
      required:
      - batch_number
      - id
      - inventory_item
      - is_expired
      - purchase_order_id
    BlankEnum:
      enum:
      - ''
    BulkEvaluateRequest:
      type: object
      properties:
        keys:
          type: array
          items:
            type: string
            maxLength: 255
          description: List of feature flag keys to evaluate.
        context:
          description: Context dictionary (e.g. tenant_id, subscription_tier) to override
            server-side context.
      required:
      - keys
    BusinessHours:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        day_of_week:
          allOf:
          - $ref: '#/components/schemas/DayOfWeekEnum'
          description: |-
            ISO 8601 day: 1=Monday … 7=Sunday

            * `1` - Monday
            * `2` - Tuesday
            * `3` - Wednesday
            * `4` - Thursday
            * `5` - Friday
            * `6` - Saturday
            * `7` - Sunday
          minimum: 0
          maximum: 9223372036854775807
        open_time:
          type: string
          format: time
        close_time:
          type: string
          format: time
        is_closed:
          type: boolean
          description: If true, closed on this day (open/close times ignored)
      required:
      - close_time
      - day_of_week
      - id
      - open_time
    BusinessHoursInput:
      type: object
      properties:
        day_of_week:
          type: integer
          maximum: 7
          minimum: 1
        open_time:
          type: string
          format: time
        close_time:
          type: string
          format: time
        is_closed:
          type: boolean
          default: false
      required:
