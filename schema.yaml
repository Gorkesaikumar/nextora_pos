  /api/v1/search/:
    get:
      operationId: search_retrieve
      description: |-
        Search across multiple contexts (products, categories, invoices, etc.)

        with ranking, trigram fuzzy matching, and Redis caching.
      parameters:
      - in: query
        name: limit
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
      - in: query
        name: offset
        schema:
          type: integer
          minimum: 0
          default: 0
      - in: query
        name: q
        schema:
          type: string
          minLength: 2
        description: Search query string.
        required: true
      - in: query
        name: type
        schema:
          enum:
          - all
          - products
          - categories
          - invoices
          - employees
          - restaurants
          - customers
          - suppliers
          type: string
          default: all
          minLength: 1
        description: |-
          Filter search results by type.

          * `all` - all
          * `products` - products
          * `categories` - categories
          * `invoices` - invoices
          * `employees` - employees
          * `restaurants` - restaurants
          * `customers` - customers
          * `suppliers` - suppliers
      tags:
      - search
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
